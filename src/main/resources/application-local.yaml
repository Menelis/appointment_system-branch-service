infrastructure:
  DB:
    USERNAME: appointment_service_user
    PASSWORD: appointment_service_user
spring:
  grpc:
    server:
      port: 9091

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/appointment_branch_service_dev
    username: ${infrastructure.DB.USERNAME}
    password: ${infrastructure.DB.PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:9000/oauth2/jwks
springdoc:
  api-docs:
    path: /branch-service/v3/api-docs
  swagger-ui:
    path: /branch-service/swagger-ui.html
    operations-sorter: method
    doc-expansion: none

server:
  port: 9002
app:
  open-api:
    info:
      title: Appointment Branch Service
      description: Appointment Branch Service
      version: 1.0.0
  white-list:
    - "/branch-service/swagger-ui/**"
    - "/branch-service/v3/api-docs/**"
  admin-routes:
    - "/api/v1/branch/admin/**"
    - "/api/v1/province/admin/**"
    - "/api/v1/city/admin/**"

logging:
  level:
    root: info
    co.appointment: trace
    org.springframework.jdbc.core.JdbcTemplate: trace
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

    org.springframework.grpc: TRACE
    org.springframework.grpc.client: TRACE

    # Underlying gRPC Java Channels, Name Resolvers & Load Balancers
    io.grpc: TRACE
    io.grpc.Channel: TRACE
    io.grpc.netty: TRACE
